# ============================================
# Gradle Project Settings - DreamStreamX
# Compatible with Gradle 8.11.1 / AGP 8.7.2 / Java 17
# ============================================

# Increase JVM memory for Gradle Daemon
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Use AndroidX (mandatory for modern builds)
android.useAndroidX=true
android.enableJetifier=true

# Enable configuration cache and parallel builds for speed
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Set the Java home (update this path if needed)
# Confirm JDK path using: where java
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

# Kotlin JVM target override
kotlin.jvm.target=17

# Enable build feature previews (optional but safe)
android.nonTransitiveRClass=true

# Suppress AGP warnings for deprecated properties
android.suppressUnsupportedCompileSdk=35

# Improve performance by reducing I/O sync calls on Windows
org.gradle.daemon=true
org.gradle.vfs.watch=true

# (Optional) Customize Gradle logging
org.gradle.logging.level=info
