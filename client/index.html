<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>DreamStream - Lucid Dreaming Assistant</title>
    <meta
      name="description"
      content="DreamStream - Your gateway to lucid dreaming with reality check notifications and curated sleep playlists for enhanced dream awareness."
    />

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#00D4FF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DreamStream" />

    <!-- App Icons -->
    <link rel="icon" type="image/png" sizes="36x36" href="/Icons/android-icon-36x36.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/Icons/android-icon-48x48.png" />
    <link rel="icon" type="image/png" sizes="72x72" href="/Icons/android-icon-72x72.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/Icons/android-icon-96x96.png" />
    <link rel="icon" type="image/png" sizes="144x144" href="/Icons/android-icon-144x144.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/Icons/android-icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/Icons/android-icon-512x512.PNG" />
    <link rel="apple-touch-icon" href="/Icons/android-icon-192x192.png" />

    <!-- Open Graph Tags -->
    <meta property="og:title" content="DreamStream - Lucid Dreaming Assistant" />
    <meta
      property="og:description"
      content="Your gateway to lucid dreaming with reality check notifications and curated sleep playlists."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/Icons/android-icon-512x512.PNG" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
